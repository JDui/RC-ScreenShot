<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- RC-ScreenShot long (scrolling) capture icon: low-saturation rainbow pill
       with a soft top gloss and light outline (matches DrawRainbowPanel).
       Glyph mirrors CaptureOverlay::DrawLongCaptureGlyph on the 48x48 grid. -->
  <defs>
    <linearGradient id="rainbow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"    stop-color="#D69E9E"/>
      <stop offset="0.2"  stop-color="#D9B894"/>
      <stop offset="0.42" stop-color="#CCC7A1"/>
      <stop offset="0.62" stop-color="#A1C4AB"/>
      <stop offset="0.8"  stop-color="#97B0CF"/>
      <stop offset="1"    stop-color="#B3A1CE"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#rainbow)"/>
  <!-- top gloss (upper half, 16% white) -->
  <rect x="3" y="3" width="42" height="21.9" rx="8" fill="#FFFFFF" fill-opacity="0.16"/>
  <!-- light outline (30% white) -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.30" stroke-width="1"/>
  <!-- content page with tapering text lines -->
  <rect x="10" y="7" width="20" height="26" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.7"/>
  <line x1="14" y1="14" x2="26"   y2="14" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="19" x2="22.5" y2="19" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="24" x2="19"   y2="24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <!-- bold rounded scroll arrow -->
  <line x1="36" y1="12" x2="36" y2="27" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="30.8" y1="21.8" x2="36" y2="27.2" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="41.2" y1="21.8" x2="36" y2="27.2" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>
  <!-- stitched output tray with raised ends -->
  <line x1="9"  y1="35.5" x2="9"  y2="38.5" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
  <line x1="39" y1="35.5" x2="39" y2="38.5" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
  <line x1="9"  y1="38.5" x2="39" y2="38.5" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round"/>
</svg>
